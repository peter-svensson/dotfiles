# Tmux settings

# default command should be path to fish executable on your system
set -g default-shell /opt/homebrew/bin/fish

# Use command space instead of command b
unbind C-b
set -g prefix C-space

# Passthrough C-a
bind-key a send-prefix

# Mouse mode
set-option -g mouse on

# Set XTerm key bindings
setw -g xterm-keys on

# Set colors
# True color settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",$TERM:Tc"

# Let TUI apps (Claude Code) pass escape sequences through unmangled
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Set reload key to r
bind r source-file ~/.tmux.conf

# Count sessions start at 1
set -g base-index 1

# Use vim bindings
setw -g mode-keys vi

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# clear + history behind prefix; never intercept C-l globally and never
# send-keys -R (resets pane emulation under TUIs like Claude Code -> redraw desync)
bind C-l send-keys C-l \; clear-history

# Set the title bar
set -g set-titles on
set -g set-titles-string '#(whoami) :: #h :: #(curl ipecho.net/plain;echo)'

# don't rename windows automatically
set-option -g allow-rename off

######################
### DESIGN CHANGES ###
######################

# panes
set -g pane-border-style fg=colour238,bg=colour235
set -g pane-active-border-style fg=colour39,bg=colour236

## Status bar design
# status line
set -g status-justify left
set -g status-bg default
set -g status-fg colour12
set -g status-interval 2

# messaging
set -g message-style fg=black,bg=yellow
set -g message-command-style fg=blue,bg=black

#window mode
setw -g mode-style fg=colour196,bg=colour238,bold

# Info on left (I don't have a session display for now)
set -g status-left ''

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-window-option -g monitor-bell on
set-option -g bell-action other

# Bell handling: notify + set persistent @bell marker
set-hook -g alert-bell "run-shell '$HOME/.local/bin/tmux-bell-notify \"#S\" \"#W\" \"#I\"'"

# Clear markers when a pane gets focus (mouse, keys, prefix). @agent is
# pane-scoped, so focusing one agent leaves its siblings in the same window
# still flagged.
set-hook -g pane-focus-in "set-option -w -q @bell 0 ; set-option -p -q @agent '' ; set-option -p -q -u pane-border-style"

# Jump to next window with pending bell (prefix + b)
bind b run-shell '$HOME/.local/bin/tmux-jump-bell'

# The modes {
setw -g clock-mode-colour colour135

# }
# The statusbar {

set -g status-position bottom
set -g status-style bg=colour234,fg=colour137,dim
set -g status-left ''
# Built from catppuccin status modules. #{E:...} expands lazily at render, so
# setting it here (before `run tpm`) is fine and lets tmux-continuum append its
# auto-save hook on top once it loads last.
set -g status-right ''
set -ag status-right '#{E:@catppuccin_status_uptime}'
set -ag status-right '#{E:@catppuccin_status_date_time}'
set -g status-right-length 100
set -g status-left-length 20

setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style fg=colour138,bg=colour235,none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F'

setw -g window-status-bell-style bold,fg=colour255,bg=colour1

# }
# The messages {

set -g message-style bold,fg=colour232,bg=colour166

# }

set-option -g history-limit 30000

set -s escape-time 0

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#v2.1.2'
# continuum must load AFTER catppuccin: it appends its auto-save hook to
# status-right, and catppuccin sets status-right. Keep continuum last or
# auto-save silently dies (argoyle/dotfiles#152).
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
# Agent state per window, aggregated over its panes. ~/.claude/hooks/tmux-notify.sh
# sets pane-scoped @agent; #{P:<#{@agent}>} concatenates every pane in the window
# being rendered, so one blocked agent colours the window even if it shares that
# window with five others. Priority: blocked (red, agent is idle waiting on a
# permission prompt) > done (green, turn finished, visit whenever) > @bell (red,
# bell from something that is not Claude Code) > default.
set -g @agent_states "#{P:<#{@agent}>}"
set -g @catppuccin_window_text "#{?#{m:*blocked*,#{E:@agent_states}},#[fg=colour255 bg=colour1 bold] #W ,#{?#{m:*done*,#{E:@agent_states}},#[fg=colour232 bg=colour2 bold] #W ,#{?@bell,#[fg=colour255 bg=colour1 bold] #W ,#[default] #W}}}"
set -g @catppuccin_window_current_text "#{?#{m:*blocked*,#{E:@agent_states}},#[fg=colour255 bg=colour1 bold] #W ,#{?#{m:*done*,#{E:@agent_states}},#[fg=colour232 bg=colour2 bold] #W ,#{?@bell,#[fg=colour255 bg=colour1 bold] #W ,#[default] #W}}}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
